<title>Disney Flower - تأكيد الطلب</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="./disney-light.css?v=1.4">
</head>
<body class="checkout-page">
  <header class="checkout-header"><a href="index.html" class="checkout-brand"><img src="./Assets/disny.png" alt="Disney Flower"><span>Disney</span></a><a href="games.html" class="checkout-back"><i class="fas fa-arrow-right"></i> الرجوع للتسوق</a></header>
  <main class="checkout-main">
    <section class="checkout-intro"><span class="section-badge"><i class="fas fa-receipt"></i> تأكيد الطلب</span><h1>طلبك جاهز، فاضل <span>بيانات بسيطة</span></h1><p>اكتب بيانات التوصيل، وهنبعت طلبك كامل على واتساب لتأكيده معاك.</p></section>
    <div class="checkout-layout">
      <form id="checkoutForm" class="customer-form" autocomplete="off">
        <h2><i class="fas fa-user-pen"></i> بيانات التوصيل</h2>
        <label for="customerName">الاسم بالكامل</label><input id="customerName" name="customerName" type="text" autocomplete="off" required placeholder="اكتب اسمك">
        <label for="customerAddress">العنوان بالتفصيل</label><textarea id="customerAddress" name="customerAddress" rows="4" autocomplete="off" required placeholder="المحافظة، المنطقة، الشارع، رقم البيت"></textarea>
        <label for="customerPhone">رقم الموبايل</label><input id="customerPhone" name="customerPhone" type="tel" inputmode="tel" autocomplete="off" required placeholder="01xxxxxxxxx">
        <label for="customerEmail">البريد الإلكتروني (اختياري)</label><input id="customerEmail" name="customerEmail" type="email" autocomplete="email" placeholder="name@example.com">
        <label for="giftMessage">رسالة الإهداء (اختياري)</label><textarea id="giftMessage" name="giftMessage" rows="2" maxlength="500" placeholder="اكتب رسالة قصيرة مع الهدية"></textarea>
        <div class="checkout-form-grid"><div><label for="deliveryDate">تاريخ التوصيل (اختياري)</label><input id="deliveryDate" name="deliveryDate" type="date"></div><div><label for="deliverySlot">فترة التوصيل (اختياري)</label><select id="deliverySlot" name="deliverySlot"><option value="">اختر الفترة</option><option>من 10 صباحًا إلى 2 ظهرًا</option><option>من 2 ظهرًا إلى 6 مساءً</option><option>من 6 مساءً إلى 10 مساءً</option></select></div></div>
        <label for="deliveryInstructions">تعليمات التغليف أو التوصيل (اختياري)</label><textarea id="deliveryInstructions" name="deliveryInstructions" rows="2" maxlength="500" placeholder="أي تفاصيل تساعدنا في تجهيز الطلب"></textarea>
        <p id="checkoutError" class="checkout-error" role="alert"></p>
        <button class="checkout-submit" type="submit"><i class="fab fa-whatsapp"></i> تأكيد وإرسال الطلب</button>
      </form>
      <section class="invoice-card" aria-labelledby="invoiceTitle">
        <div class="invoice-heading"><div><span>Disney</span><h2 id="invoiceTitle">ملخص الفاتورة</h2></div><i class="fas fa-basket-shopping"></i></div>
        <div id="invoiceItems" class="invoice-items"></div>
        <div class="invoice-totals"><div><span>إجمالي المنتجات</span><strong id="invoiceSubtotal">0 جنيه</strong></div><div><span>التوصيل</span><strong>20 جنيه</strong></div><div class="invoice-total"><span>الإجمالي النهائي</span><strong id="invoiceTotal">20 جنيه</strong></div></div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-catalog.js?v=1.0"></script>
  <script src="./checkout.js?v=1.2"></script>
